<!DOCTYPE html>
<html lang="en">
<head>
<title>Driver Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
:root{
  --primary:#2563eb;
  --bg:#f4f7fb;
  --border:#e5e7eb;
  --muted:#6b7280;
}

*{box-sizing:border-box;font-family:'Inter',sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#f4f7fb);
}

.back-btn{
  position:fixed;
  top:24px;
  left:24px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--border);
  color:#111827;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
}

.wrapper{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:36px 32px;
  border-radius:22px;
  box-shadow:0 30px 60px rgba(0,0,0,.12);
}

h2{
  text-align:center;
  font-weight:800;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:26px;
}

.field{
  position:relative;
  margin-bottom:16px;
}

.field i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
}

input{
  width:100%;
  height:48px;
  padding:0 48px;
  border-radius:14px;
  border:1px solid var(--border);
}

input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}

.toggle-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  height:32px;
  width:32px;
  border:none;
  background:#f1f3f6;
  border-radius:8px;
  cursor:pointer;
}

button.submit{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:999px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
}

.footer{
  text-align:center;
  margin-top:18px;
}

.footer a{
  color:var(--primary);
  font-weight:600;
}

.error-msg{
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:12px;
  margin-bottom:18px;
  text-align:center;
}
</style>
</head>

<body>

<a href="javascript:history.back()" class="back-btn">
  <i class="fa-solid fa-arrow-left"></i> Back
</a>

<div class="wrapper">
  <div class="card">

    <h2>Driver Login</h2>
    <div class="subtitle">Login to start your trips</div>

    {% for message in messages %}
      <div class="error-msg">{{ message }}</div>
    {% endfor %}

    <form method="post" action="{% url 'driver_login' %}">
      {% csrf_token %}

      <!-- PHONE -->
      <div class="field">
        <i class="fa-solid fa-phone"></i>
        <input name="phone" placeholder="Phone Number" required>
      </div>

      <!-- PASSWORD -->
      <div class="field">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Password" required>

        <button type="button" class="toggle-password" id="togglePassword">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>

      <button type="submit" class="submit">Login</button>
    </form>

    <div class="footer">
      New driver?
      <a href="{% url 'driver_register' %}">Register here</a>
    </div>

  </div>
</div>

<script>
const toggleBtn = document.getElementById("togglePassword");
const passwordInput = document.getElementById("password");
const icon = toggleBtn.querySelector("i");

toggleBtn.addEventListener("click", () => {
  const hidden = passwordInput.type === "password";
  passwordInput.type = hidden ? "text" : "password";
  icon.classList.toggle("fa-eye");
  icon.classList.toggle("fa-eye-slash");
});
</script>

</body>
</html>
