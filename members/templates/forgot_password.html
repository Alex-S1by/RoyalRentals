{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Forgot Password – Carbook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap" rel="stylesheet">
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --primary: #1089ff; --bg: #f4f6f9; --border: #e2e6ea; }
        body { min-height: 100vh; font-family: 'Poppins', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; background: #fff; padding: 42px 38px; border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.12); }
        .form-control { height: 48px; border-radius: 12px; }
        .btn-primary { background: var(--primary); border: none; height: 48px; border-radius: 12px; font-weight: 600; width: 100%; }
        .back-btn { position: absolute; top: 24px; left: 24px; padding: 8px 14px; background: #fff; border-radius: 10px; text-decoration: none; color: #333; border: 1px solid var(--border); }
    </style>
</head>
<body>

<a href="{% url 'login' %}" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

<div class="login-card">
    <h2 class="text-center mb-2">Forgot Password?</h2>
    <div class="text-center text-muted mb-4" style="font-size: 14px;">Enter your email to receive an OTP.</div>

    {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} text-center" style="font-size: 14px;">{{ message }}</div>
    {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label style="font-weight: 500; font-size: 13px;">Email Address</label>
            <input type="email" class="form-control" name="email" required placeholder="name@example.com">
        </div>
        <button type="submit" class="btn btn-primary">Send OTP</button>
    </form>
</div>

</body>
</html>
