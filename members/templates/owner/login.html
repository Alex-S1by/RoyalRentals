<!DOCTYPE html>
<html lang="en">
<head>
<title>Owner Login </title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
:root{
  --primary:#2563eb;
  --bg:#f4f7fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --muted:#6b7280;
}

*{box-sizing:border-box;font-family:'Inter',sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#f4f7fb);
}

/* BACK BUTTON */
.back-btn{
  position:fixed;
  top:24px;
  left:24px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--border);
  color:#111827;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  transition:.2s ease;
  z-index:10;
}

.back-btn:hover{
  background:#f9fafb;
  transform:translateX(-2px);
}

/* CENTER */
.wrapper{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* CARD */
.card{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:36px 32px 38px;
  border-radius:22px;
  box-shadow:0 30px 60px rgba(0,0,0,.12);
}

/* HEADER */
h2{
  text-align:center;
  font-weight:800;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:26px;
}

/* INPUT */
.field{
  position:relative;
  margin-bottom:16px;
}

.field i{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  font-size:14px;
}

input{
  width:100%;
  height:48px;                 /* LOCK HEIGHT */
  padding:0 48px;
  border-radius:14px;
  border:1px solid var(--border);
  font-size:14px;
  outline:none;
  transition:.2s ease;
}

input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}

/* PASSWORD TOGGLE */
.toggle-password{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  height:32px;
  width:32px;
  display:flex;
  align-items:center;
  justify-content:center;

  border:none;
  background:#f1f3f6;
  border-radius:8px;
  cursor:pointer;
  color:#64748b;
}

/* REMOVE ALL FOCUS */
.toggle-password:focus,
.toggle-password:focus-visible,
.toggle-password:active{
  outline:none !important;
  box-shadow:none !important;
}

.toggle-password:hover{
  background:#e5e7eb;
  color:var(--primary);
}

/* BUTTON */
button.submit{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:999px;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

button.submit:hover{
  background:#1e40af;
}

/* FOOTER */
.footer{
  text-align:center;
  margin-top:18px;
  font-size:14px;
}

.footer a{
  color:var(--primary);
  font-weight:600;
  text-decoration:none;
}
.icon1{
margin-left: -5px;
}

/* ERROR MESSAGE */
.error-msg{
  background:#fee2e2;
  color:#991b1b;
  padding:12px 14px;
  border-radius:12px;
  font-size:14px;
  font-weight:500;
  margin-bottom:18px;
  text-align:center;
}

</style>
</head>

<body>

<a href="javascript:history.back()" class="back-btn">
  <i class="fa-solid fa-arrow-left"></i> Back
</a>

<div class="wrapper">
  <div class="card">

    <h2>Owner Login</h2>
    <div class="subtitle">Login to manage your cars</div>

    {% if messages %}
  {% for message in messages %}
    <div class="error-msg">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}


    <form method="post" action="{% url 'owner_login' %}">
      {% csrf_token %}

      <div class="field">
        <i class="fa-solid fa-user"></i>
        <input name="name" placeholder="Owner Name" required>
      </div>

      <div class="field">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" name="password" placeholder="Password" required>

        <button type="button" class="toggle-password" id="togglePassword">
          <i class="fa-solid fa-eye icon1" ></i>
        </button>
      </div>

      <button type="submit" class="submit">Login</button>
    </form>

    <div class="footer">
      New owner?
      <a href="{% url 'owner_register' %}">Register here</a>
    </div>

  </div>
</div>

<script>
const toggleBtn = document.getElementById("togglePassword");
const passwordInput = document.getElementById("password");
const icon = toggleBtn.querySelector("i");

toggleBtn.addEventListener("click", () => {
  const hidden = passwordInput.type === "password";
  passwordInput.type = hidden ? "text" : "password";
  icon.classList.toggle("fa-eye");
  icon.classList.toggle("fa-eye-slash");
});
</script>

</body>
</html>
